name: فك الضغط تلقائيا

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: فك الضغط وحذف الملف المضغوط
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "فك ضغط: $f"
            unzip -o "$f" -x "__MACOSX/*" ".DS_Store" -d .
            rm -f "$f"
          done

      - name: حفظ التغييرات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات"
          else
            git commit -m "فك الضغط تلقائيا"
            git push
          fi
